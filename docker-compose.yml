# Campaign API - local environment topology
# Chris Delport <chrisd@chrisd.co.za>
#
# Services: nginx -> app (php-fpm) -> mysql / redis.
# 'queue' is a second container from the same image running the Redis
# queue worker - the import endpoint needs it to actually process jobs.
# MySQL is healthchecked so the app never boots before the DB accepts
# connections.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-campaign}
      MYSQL_USER: ${DB_USERNAME:-campaign}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # Host port defaults to 33061 to avoid clashing with a local MySQL
      # already bound to 3306. Override with MYSQL_HOST_PORT in .env if you
      # want another host port (or remove this mapping entirely - containers
      # reach MySQL over the compose network via the 'mysql' hostname and
      # DB_PORT, which stays 3306 inside the network).
      - "${MYSQL_HOST_PORT:-33061}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./:/var/www/html
    command: php artisan queue:work redis --tries=3 --max-jobs=1000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql-data:
